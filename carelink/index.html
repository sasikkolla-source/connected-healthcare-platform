<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareLink – Connected Healthcare Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">CareLink</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <select id="who" aria-label="Patient" style="width:auto"></select>
    <div class="seg" role="group" aria-label="Role">
      <button data-role="patient" aria-pressed="true">Patient</button>
      <button data-role="doctor" aria-pressed="false">Doctor</button>
    </div>
  </div>
</header>
<nav role="tablist" id="tabs"></nav>
<main id="view"></main>

<script src="script.js"></script>
</body>
</html>
